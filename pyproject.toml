[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder"
version = "0.1.0"
description = "Transcription pipeline SDK for an all-day wearable recorder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# av 19 removed open(metadata_errors=...), which faster-whisper 1.2.1 still passes
whisper = ["faster-whisper>=1.0", "av>=11,<19"]
dev = ["pytest>=8"]

[project.scripts]
recorder = "recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
