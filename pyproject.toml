[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder"
version = "0.3.0"
description = "Transcription pipeline SDK for an all-day wearable recorder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# hotwords needs faster-whisper 1.1+. av 19 removed open(metadata_errors=...), which faster-whisper 1.2.1 still passes
whisper = ["faster-whisper>=1.1", "av>=11,<19"]
# CUDA runtime libs for the GPU, if not installed system-wide (needed on Windows)
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# me/other speaker labelling (pulls in torch); load_audio uses faster-whisper
# (torchaudio also does the forced alignment for precise word times)
speaker = ["speechbrain>=1.0", "torchaudio>=2.1", "faster-whisper>=1.1", "av>=11,<19"]
# IPA, sound-alike candidates and pronunciation diffs for unsure words (CMU dictionary)
learn = ["cmudict>=1.0"]
# synthesised standard pronunciations: American female / male voices (Kokoro, ONNX)
tts = ["kokoro-onnx>=0.4"]
dev = ["pytest>=8", "ruff", "cmudict>=1.0", "av>=11,<19"]

[project.scripts]
recorder = "recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recorder = ["web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
