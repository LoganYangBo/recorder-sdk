[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder"
version = "0.1.0"
description = "Transcription pipeline SDK for an all-day wearable recorder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# hotwords needs faster-whisper 1.1+. av 19 removed open(metadata_errors=...), which faster-whisper 1.2.1 still passes
whisper = ["faster-whisper>=1.1", "av>=11,<19"]
# CUDA runtime libs for the GPU, if not installed system-wide (needed on Windows)
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# me/other speaker labelling (pulls in torch); load_audio uses faster-whisper
speaker = ["speechbrain>=1.0", "faster-whisper>=1.1", "av>=11,<19"]
# IPA, sound-alike candidates and pronunciation diffs for unsure words (CMU dictionary)
learn = ["cmudict>=1.0"]
dev = ["pytest>=8", "cmudict>=1.0"]

[project.scripts]
recorder = "recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recorder = ["web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
