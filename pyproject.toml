[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recorder"
version = "0.1.0"
description = "Transcription pipeline SDK for an all-day wearable recorder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
recorder = "recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
