<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f6fdb; --accent-soft: #e6eefc; --hover: #f1f1ed; --warn: #b4690e;
  --danger: #c0392b; --play: #fff6d6;
  --s0: #2f6fdb; --s1: #0f8a6a; --s2: #a347b8; --s3: #c2570c; --s4: #b8336a; --s5: #5b6ac9;
  --other: #8a8a84;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #e9e9e4; --muted: #9a9a93; --line: #33332f;
    --accent: #7aa7ff; --accent-soft: #23314d; --hover: #2a2a27; --warn: #e3a24a;
    --danger: #ef7563; --play: #3a3420;
    --s0: #7aa7ff; --s1: #4cc8a3; --s2: #d08ae0; --s3: #f0955a; --s4: #ef7aa6; --s5: #9aa5f5;
    --other: #8a8a84;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
button, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: none; background: none; color: var(--accent); padding: 0; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px; outline: none; }
input:focus { border-color: var(--accent); }

header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header input[type=search] { flex: 1; min-width: 0; max-width: 420px; }
header button { white-space: nowrap; }
header .spacer { flex: 1; }

.layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 51px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin: 14px 14px 6px; font-weight: 600; }
.rec { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
.rec:hover { background: var(--hover); }
.rec.active { background: var(--accent-soft); border-left-color: var(--accent); }
.rec .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .meta { color: var(--muted); font-size: 12px; }
main { overflow-y: auto; }
.empty { color: var(--muted); padding: 40px; text-align: center; }

.top { position: sticky; top: 0; background: var(--bg); z-index: 3; padding: 14px 20px 8px;
  border-bottom: 1px solid var(--line); }
.top h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.top audio { width: 100%; height: 36px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 8px;
  color: var(--muted); font-size: 13px; }
.toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg-toggle button { border: none; border-radius: 0; padding: 3px 10px; }
.seg-toggle button.on { background: var(--accent); color: #fff; }

.selbar { display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
  background: var(--accent-soft); border-radius: 8px; }
.selbar.show { display: flex; flex-wrap: wrap; }

.lines { padding: 8px 12px 80px; }
.line { display: grid; grid-template-columns: 22px 92px 110px 1fr; gap: 8px; padding: 6px 8px;
  border-radius: 6px; align-items: baseline; }
.line:hover { background: var(--hover); }
.line.playing { background: var(--play); }
.line.flash { outline: 2px solid var(--accent); }
.line .n { color: var(--muted); font-size: 11px; text-align: right; }
.line .t { color: var(--accent); cursor: pointer; font-variant-numeric: tabular-nums; font-size: 13px; }
.line .t:hover { text-decoration: underline; }
.line input[type=checkbox] { margin: 0; }
.mode-turns .line { grid-template-columns: 70px 110px 1fr; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 10px;
  border: 1px solid currentColor; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 108px; }
.chip.none { color: var(--muted); border-style: dashed; font-weight: 400; }
.score { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.text .w { cursor: pointer; border-radius: 3px; }
.text .w:hover { background: var(--accent-soft); }
.show-low .text .w.low { text-decoration: underline dotted var(--warn) 2px; text-underline-offset: 3px; }
.show-low .text .w.vlow { color: var(--warn); }
.text .w.fixed { text-decoration: underline solid var(--s1) 2px; text-underline-offset: 3px; }
.text .w.ok { text-decoration: underline dotted var(--s1) 1px; text-underline-offset: 3px; }
.text .w.low, .text .w.fixed, .text .w.ok { cursor: help; }
.pop { position: absolute; z-index: 15; width: 390px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 12px 14px; font-size: 13px; }
.pop .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.pop .h b { font-size: 15px; }
.pop .muted { color: var(--muted); font-size: 12px; }
.pop .cands { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pop .cand { display: flex; flex-direction: column; align-items: flex-start; padding: 4px 10px; }
.pop .cand small { color: var(--muted); font-size: 11px; }
.pop .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.pop .row input { flex: 1; min-width: 0; }
.pop .cmp { display: grid; grid-template-columns: 64px 1fr auto; gap: 6px 8px; align-items: center; margin: 6px 0; }
.ipa { font-family: "Charis SIL", "Doulos SIL", "Segoe UI", serif; font-size: 15px; }
.ipa .bad { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); border-radius: 3px; padding: 0 1px; }
.ipa .miss { color: var(--danger); text-decoration: line-through; }
.play-group { display: flex; gap: 4px; align-items: center; }
select.voice { font-size: 12px; padding: 3px 4px; }
.pop .cmp { grid-template-columns: 64px 1fr auto; }
.why { margin-top: 6px; padding: 6px 8px; background: var(--hover); border-radius: 6px; }
.play { white-space: nowrap; }
.top a:has(button) { color: inherit; text-decoration: none; }
.notes { padding: 16px 20px 60px; }
.note { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.note .words { font-size: 15px; }
.note .meta { color: var(--muted); font-size: 12px; }
.note .btns { display: flex; gap: 6px; align-items: center; grid-row: span 2; }

.results .hit { padding: 10px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
.results .hit:hover { background: var(--hover); }
.results .hit .meta { color: var(--muted); font-size: 12px; }
mark { background: var(--play); color: inherit; padding: 0 1px; }

.drawer { position: fixed; top: 51px; right: 0; bottom: 0; width: 340px; background: var(--panel);
  border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .15s;
  z-index: 10; overflow-y: auto; padding: 16px; box-shadow: -4px 0 16px rgba(0,0,0,.06); }
.drawer.open { transform: none; }
.drawer h3 { margin: 0 0 10px; font-size: 15px; }
.drawer section { margin-bottom: 22px; }
.drawer .spk { display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--line); }
.drawer .spk .count { color: var(--muted); font-size: 12px; flex: 1; }
.drawer p.hint { color: var(--muted); font-size: 12px; margin: 6px 0; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input { flex: 1; }
.slider b { font-variant-numeric: tabular-nums; width: 36px; }
.row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s;
  pointer-events: none; z-index: 20; max-width: 80vw; }
.toast.show { opacity: .92; }
.busy { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center;
  justify-content: center; z-index: 30; }
.busy.show { display: flex; }
.busy div { background: var(--panel); padding: 16px 22px; border-radius: 10px; }

.jobs { padding: 0 14px 6px; }
.job { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 3px 0; }
.job .jn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .st { color: var(--muted); white-space: nowrap; }
.job .st.err { color: var(--danger); cursor: help; }
.job .st.ok { color: var(--s1); }
.spin { width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.drop { position: fixed; inset: 0; background: rgba(47,111,219,.12); border: 3px dashed var(--accent);
  display: none; align-items: center; justify-content: center; z-index: 40; font-size: 20px;
  color: var(--accent); font-weight: 600; pointer-events: none; }
.drop.show { display: flex; }
.title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.title-row h2 { margin: 0; }
.title-row .file { color: var(--muted); font-size: 12px; }
.when { color: var(--muted); font-size: 13px; margin: -4px 0 8px; display: flex; gap: 8px; align-items: center; }
.when .muted { color: var(--muted); }
.day { padding: 10px 14px 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.title-row input { font-size: 16px; font-weight: 600; flex: 1; max-width: 480px; }
button.rec-btn { color: var(--danger); border-color: var(--danger); white-space: nowrap; }
button.rec-btn::before { content: "●"; margin-right: 5px; }
.live { padding: 20px; max-width: 900px; }
.live-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.live-head .clock { font-size: 26px; font-variant-numeric: tabular-nums; font-weight: 600; }
.big { font-size: 15px; padding: 8px 18px; border-radius: 20px; }
.big.start { background: var(--danger); border-color: var(--danger); color: #fff; }
.big.stop { border-color: var(--danger); color: var(--danger); }
.meter { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter div { height: 100%; width: 0; background: var(--s1); transition: width .1s; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.live .partial { color: var(--muted); font-style: italic; padding: 6px 8px; }
.live .line { grid-template-columns: 64px 110px 1fr; }
.live .status { color: var(--muted); font-size: 13px; }
.dev-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.dev-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.dev-card .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.dev-card .v { font-size: 20px; font-weight: 600; }
.dev-card .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.dev-card .meter { width: 100%; margin-top: 8px; }
.meter.batt div { background: var(--s1); }
.meter.batt.low div { background: var(--danger); }
.dev-sync { margin-bottom: 18px; align-items: center; gap: 14px; }
.device h3 { margin: 8px 0 10px; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 180px; border-right: none; border-bottom: 1px solid var(--line); }
  .line { grid-template-columns: 22px 58px 1fr; }
  .line .who { grid-column: 3; }
  header .spacer { display: none; }
  .line .text { grid-column: 2 / 4; }
  .mode-turns .line { grid-template-columns: 58px 1fr; }
  .mode-turns .line .who { grid-column: 2; }
  .mode-turns .line .text { grid-column: 1 / 3; }
  .drawer { width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>Recorder</h1>
  <input type="search" id="q" data-i18n-ph="searchPh">
  <span class="spacer"></span>
  <button id="importBtn" data-i18n="import"></button>
  <input type="file" id="fileIn" accept="audio/*,.m4a,.mp3,.wav,.flac,.ogg,.opus,.aac" multiple hidden>
  <button class="rec-btn" id="liveBtn" data-i18n="live"></button>
  <button id="devBtn" data-i18n="device"></button>
  <button id="openNotes" data-i18n="notes"></button>
  <button id="openSpk" data-i18n="speakers"></button>
  <button class="link" id="langBtn"></button>
</header>

<div class="layout">
  <aside>
    <div id="jobsBox" hidden><h2 data-i18n="jobs"></h2><div class="jobs" id="jobs"></div></div>
    <h2 data-i18n="recordings"></h2>
    <div id="recs"></div>
  </aside>
  <main id="main"><div class="empty" data-i18n="pickRec"></div></main>
</div>

<div class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="margin:0" data-i18n="speakers"></h3><button class="link" id="closeSpk" data-i18n="close"></button>
  </div>
  <section>
    <div id="spkList"></div>
    <p class="hint" data-i18n="spkHint"></p>
  </section>
  <section>
    <h3 data-i18n="threshold"></h3>
    <div class="slider"><input type="range" id="thr" min="0" max="0.8" step="0.01"><b id="thrVal"></b></div>
    <p class="hint" data-i18n="thrHint"></p>
    <div class="row">
      <button class="primary" id="applyThr" data-i18n="applyThr"></button>
      <button id="rescore" data-i18n="rescore"></button>
    </div>
    <p class="hint" data-i18n="rescoreHint"></p>
  </section>
</div>

<div class="drop" id="drop" data-i18n="drop"></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div id="busyText"></div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const state = {
  recs: [], rec: null, segs: [], speakers: [], selected: new Set(),
  mode: localGet("mode", "segments"), scores: localGet("scores", "0") === "1",
  low: localGet("low", "1") === "1", threshold: parseFloat(localGet("threshold", "0.3")),
};

function localGet(k, d) { try { return localStorage.getItem("rec." + k) ?? d; } catch { return d; } }
function localSet(k, v) { try { localStorage.setItem("rec." + k, v); } catch {} }

const LANG = (l => l in STRINGS ? l : (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en")(localGet("lang", ""));
// t("key", {name: ...}) fills {name}; values are inserted as given, so escape them first where needed.
// With n === 1, "key1" is used if there is one (English singulars).
function t(key, vars = {}) {
  const pick = k => STRINGS[LANG][k] ?? STRINGS.en[k];
  const s = (vars.n === 1 && STRINGS[LANG][key + "1"]) || pick(key) || key;
  return typeof s === "string" ? s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m) : s;
}
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
$("#langBtn").textContent = t("otherLang");
$("#langBtn").onclick = () => { localSet("lang", LANG === "zh" ? "en" : "zh"); location.reload(); };

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function busy(text, fn) {
  $("#busyText").textContent = text; $("#busy").classList.add("show");
  try { return await fn(); } catch (e) { toast(t("error", { msg: e.message })); } finally { $("#busy").classList.remove("show"); }
}

const fmt = t => {
  t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
};
// wall-clock time `offset` seconds into a recording, if its start time is known
const startDate = r => r && r.started_at ? new Date(r.started_at) : null;  // local time
const pad2 = n => String(n).padStart(2, "0");
function clock(r, offset, secs = true) {
  const d = startDate(r); if (!d) return null;
  const t = new Date(d.getTime() + offset * 1000);
  return pad2(t.getHours()) + ":" + pad2(t.getMinutes()) + (secs ? ":" + pad2(t.getSeconds()) : "");
}
const dayLabel = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${t("week")[d.getDay()]}`;
// a time cell: the wall-clock time when known, the offset into the recording otherwise
const timeText = (r, offset) => clock(r, offset) ?? fmt(offset);
const timeTitle = (r, offset) => clock(r, offset) ? t("offsetTitle", { t: fmt(offset) }) : t("noStart");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function speakerColor(name) {
  if (!name || name === "other") return "var(--other)";
  if (name === "me") return "var(--s0)";
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `var(--s${1 + (h % 5)})`;
}
function chip(name) {
  if (!name) return `<span class="chip none">${t("unlabelled")}</span>`;
  return `<span class="chip" style="color:${speakerColor(name)}" title="${esc(name)}">${esc(name)}</span>`;
}

async function loadRecs() {
  state.recs = await api("/api/recordings");
  // grouped by day, newest day first, in time order within a day; undated ones last
  const groups = new Map();
  for (const r of [...state.recs].sort((a, b) => (b.started_at || "").localeCompare(a.started_at || "") || b.id - a.id)) {
    const key = r.started_at ? dayLabel(startDate(r)) : t("undated");
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const undated = groups.get(t("undated")); groups.delete(t("undated")); if (undated) groups.set(t("undated"), undated);
  $("#recs").innerHTML = state.recs.length ? [...groups].map(([day, recs]) => `
    <div class="day">${esc(day)}</div>` + recs.sort((a, b) => (a.started_at || "").localeCompare(b.started_at || "") || a.id - b.id).map(r => `
    <div class="rec ${state.rec?.id === r.id ? "active" : ""}" data-id="${r.id}">
      <div class="name" title="${esc(r.path)}">${esc(r.name)}</div>
      <div class="meta">${r.started_at ? `${clock(r, 0, false)}–${clock(r, r.duration, false)}` : "#" + r.id} · ${fmt(r.duration)} · ${t("nSegs", { n: r.segments })} · ${esc(r.model || "?")}</div>
    </div>`).join("")).join("") : `<div class="empty">${t("noRecs")}</div>`;
}

function turns(segs, maxGap = 1.5) {
  const out = [];
  for (const s of segs) {
    const last = out[out.length - 1];
    if (last && last.speaker === s.speaker && s.start - last.end <= maxGap) {
      last.end = Math.max(last.end, s.end); last.segs.push(s);
    } else out.push({ start: s.start, end: s.end, speaker: s.speaker, segs: [s] });
  }
  return out;
}

const norm = w => String(w).toLowerCase().replace(/^[^\w']+|[^\w']+$/g, "");
function wordsHtml(seg) {
  if (!seg.words.length) return esc(seg.text);
  return seg.words.map(([w, st, , p, id, orig]) => {
    let cls = p < 0.3 ? "w low vlow" : p < 0.6 ? "w low" : "w", title = t("wordTitle", { p: Math.round(p * 100) });
    if (orig != null) {
      const changed = norm(orig) !== norm(w);
      cls = changed ? "w fixed" : "w ok";
      title = changed ? t("wordFixed", { orig }) : t("wordOk");
    }
    if (id == null) cls = cls.replace(/ ?(low|fixed|ok)/g, "");
    return `<span class="${cls}" data-t="${st}" ${id != null ? `data-wid="${id}"` : ""} title="${esc(title)}">${esc(w)}</span>`;
  }).join(" ");
}

function renderLines() {
  const lines = $("#lines");
  lines.parentElement.classList.toggle("show-low", state.low);
  const counts = {};
  state.segs.forEach(s => { const k = s.speaker || t("unlabelled"); counts[k] = (counts[k] || 0) + 1; });
  $("#counts").textContent = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(" · ");
  if (!state.segs.length) { lines.innerHTML = `<div class="empty">${t("noTranscript")}</div>`; return; }
  const isTurns = state.mode === "turns";
  $("main").classList.toggle("mode-turns", isTurns);
  if (isTurns) {
    lines.innerHTML = turns(state.segs).map(turn => `
      <div class="line" data-start="${turn.start}" data-end="${turn.end}">
        <span class="t" data-t="${turn.start}" title="${timeTitle(state.rec, turn.start)}">${timeText(state.rec, turn.start)}</span>
        <span class="who">${chip(turn.speaker)}</span>
        <span class="text">${turn.segs.map(wordsHtml).join(" ")}</span>
      </div>`).join("");
  } else {
    lines.innerHTML = state.segs.map(s => {
      const score = state.scores && s.score != null
        ? `<span class="score">${s.match !== s.speaker ? "~" + esc(s.match) + " " : ""}${s.score.toFixed(2)}</span>` : "";
      return `
      <div class="line" data-start="${s.start}" data-end="${s.end}" data-n="${s.n}">
        <input type="checkbox" data-n="${s.n}" ${state.selected.has(s.n) ? "checked" : ""}>
        <span class="t" data-t="${s.start}" title="${timeTitle(state.rec, s.start)}">${timeText(state.rec, s.start)}<span class="n"> #${s.n}</span></span>
        <span class="who">${chip(s.speaker)}${score}</span>
        <span class="text">${wordsHtml(s)}</span>
      </div>`;
    }).join("");
  }
  updateSelbar();
}

function updateSelbar() {
  const bar = $("#selbar"); if (!bar) return;
  const segs = state.segs.filter(s => state.selected.has(s.n));
  const secs = segs.reduce((a, s) => a + (s.end - s.start), 0);
  bar.classList.toggle("show", segs.length > 0);
  $("#selInfo").textContent = t("selected", { n: segs.length, s: Math.round(secs) });
}

function seek(t, play = true) {
  const a = $("#audio"); if (!a) return;
  a.currentTime = t; if (play) a.play().catch(() => {});
}
function highlightPlaying() {
  const t = $("#audio").currentTime;
  let cur = null;
  document.querySelectorAll(".line").forEach(el => {
    const on = t >= +el.dataset.start && t < +el.dataset.end;
    el.classList.toggle("playing", on); if (on) cur = el;
  });
  if (cur && cur !== highlightPlaying.last) {
    const r = cur.getBoundingClientRect();
    if (r.top < 160 || r.bottom > innerHeight) cur.scrollIntoView({ block: "center", behavior: "smooth" });
    highlightPlaying.last = cur;
  }
}

async function enrollSelected() {
  const name = $("#enrollName").value.trim();
  if (!name) { toast(t("needName")); return; }
  const exists = state.speakers.some(s => s.name === name);

  await busy(t("enrolling", { name }), async () => {
    const r = await api("/api/speakers/enroll", { method: "POST",
      body: { name, recording: state.rec.id, segments: [...state.selected], threshold: state.threshold } });
    await loadSpeakers();
    await openRec(state.rec.id);
    toast(r.labelled
      ? t("enrolled", { name, n: r.labelled })
      : t("enrolledNone", { name }));
  });
}

const uploading = [];
async function uploadFiles(files) {
  for (const f of files) {
    const u = { name: f.name, status: "uploading" }; uploading.push(u); renderJobs();
    try {
      const res = await fetch(`/api/import?name=${encodeURIComponent(f.name)}&threshold=${state.threshold}`,
        { method: "POST", body: f, headers: { "Content-Type": "application/octet-stream" } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
    } catch (e) { toast(t("fileErr", { name: f.name, msg: e.message })); }
    uploading.splice(uploading.indexOf(u), 1);
    pollJobs();
  }
}

// Finished imports leave the list a few seconds after they finish; errors stay
// until dismissed. Jobs already finished when the page loads are not shown.
let jobsTimer, firstPoll = true;
const seenDone = new Set(), hidden = new Set();
async function pollJobs() {
  clearTimeout(jobsTimer);
  const jobs = await api("/api/jobs").catch(() => []);
  let changed = false;
  for (const j of jobs) {
    const finished = j.status === "done" || j.status === "duplicate";
    if (firstPoll && (finished || j.status === "error")) { hidden.add(j.id); seenDone.add(j.id); continue; }
    if (finished && !seenDone.has(j.id)) {
      seenDone.add(j.id); changed = true;
      if (j.status === "duplicate") toast(t("dupImport", { name: j.name }));
      setTimeout(() => { hidden.add(j.id); renderJobs(); }, 4000);
    }
  }
  firstPoll = false;
  renderJobs(jobs);
  if (changed) await loadRecs();
  if (jobs.some(j => ["queued", "running"].includes(j.status)) || uploading.length)
    jobsTimer = setTimeout(pollJobs, 2000);
}
function jobLabel(j, label) {
  if (j.kind === "device") {
    if (j.status === "running" && j.progress) {
      const [i, n] = j.progress, mb = b => (b / 1e6).toFixed(1);
      const bytes = j.bytes ? ` · ${mb(j.bytes[0])}/${mb(j.bytes[1])} MB` : "";
      const rate = j.stage === "downloading" && j.rate ? ` · ${Math.round(j.rate / 1000)} KB/s` : "";
      return t(j.stage === "transcribing" ? "devTranscribingN" : "devDownloading", { i: Math.min(i + 1, n), n }) + bytes + rate;
    }
    return j.status === "done" ? t("devSynced", { n: j.new }) : label[j.status];
  }
  if (j.kind !== "suggest") return label[j.status];
  if (j.status === "running") return j.progress ? t("analysingN", { i: j.progress[0], n: j.progress[1] }) : t("analysing");
  return j.status === "done" ? t("analysed") : label[j.status];
}
function renderJobs(jobs = renderJobs.last || []) {
  renderJobs.last = jobs;
  const label = { queued: t("jobQueued"), running: t("jobRunning"), done: t("jobDone"), duplicate: t("jobDuplicate"), error: t("jobError") };
  const rows = [
    ...uploading.map(u => `<div class="job"><span class="spin"></span><span class="jn">${esc(u.name)}</span><span class="st">${t("uploading")}</span></div>`),
    ...jobs.filter(j => !hidden.has(j.id)).map(j => `<div class="job" ${j.recording ? `data-open="${j.recording}" style="cursor:pointer"` : ""}>
      ${["queued", "running"].includes(j.status) ? `<span class="spin"></span>` : ""}
      <span class="jn">${esc(j.name)}</span>
      <span class="st ${j.status === "error" ? "err" : j.status === "done" ? "ok" : ""}" title="${esc(j.error || "")}">${jobLabel(j, label)}</span>
      ${j.status === "error" ? `<button class="link" data-dismiss="${j.id}" title="${t("close")}">✕</button>` : ""}</div>`),
  ];
  $("#jobsBox").hidden = !rows.length;
  $("#jobs").innerHTML = rows.join("");
}
$("#jobs").addEventListener("click", e => {
  const d = e.target.closest("[data-dismiss]");
  if (d) { hidden.add(+d.dataset.dismiss); renderJobs(); return; }
  const el = e.target.closest("[data-open]"); if (el) { stopLiveView(); openRec(+el.dataset.open); }
});

async function choose(el, wid, word, clip) {
  let c;

function ipaDiff(cmp) {
  // target IPA with wrongly said / missing sounds marked, and the heard IPA with the substitutes
  if (!cmp.target_ipa || !cmp.heard_ipa) return null;
  let tt = "", h = "", why = [];
  for (const o of cmp.ops) {
    if (o.op === "same") { tt += esc(o.target); h += esc(o.heard); }
    else if (o.op === "sub") { tt += `<span class="bad">${esc(o.target)}</span>`; h += `<span class="bad">${esc(o.heard)}</span>`; why.push(t("diffSub", { a: o.target, b: o.heard })); }
    else if (o.op === "del") { tt += `<span class="bad">${esc(o.target)}</span>`; why.push(t("diffDel", { a: o.target })); }
    else { h += `<span class="bad">${esc(o.heard)}</span>`; why.push(t("diffIns", { b: o.heard })); }
  }
  // a word that shares little sound with the intended one was misheard, not mispronounced
  const same = cmp.ops.filter(o => o.op === "same").length;
  if (why.length > 2 && same < why.length) why = [t("diffFar")];
  return { t: tt, h, why };
}

function compareHtml(c) {
  if (c.heard === c.chosen) {  // confirmed: Whisper got it right but wasn't sure
    const ipa = c.compare.target_ipa;
    return `
    <div class="cmp">
      <span class="muted">${t("standard")}</span><span><b>${esc(c.chosen)}</b> ${ipa ? `<span class="ipa">/${esc(ipa)}/</span>` : ""}</span>
      <span class="play-group"><button class="play" data-say="${esc(c.chosen)}">${t("sayStd")}</button>${voiceSelect()}</span>
      <span class="muted">${t("yourAudio")}</span><span class="muted">${c.probability != null ? t("rightUnsureP", { p: Math.round(c.probability * 100) }) : t("rightUnsure")}</span>
      <button class="play" data-clip>${t("playClip")}</button>
    </div>
    <div class="why">${t("whyUnsure")}</div>`;
  }
  const d = ipaDiff(c.compare);
  return `
    <div class="cmp">
      <span class="muted">${t("meant")}</span><span><b>${esc(c.chosen)}</b> ${d ? `<span class="ipa">/${d.t}/</span>` : ""}</span>
      <span class="play-group"><button class="play" data-say="${esc(c.chosen)}">${t("sayStd")}</button>${voiceSelect()}</span>
      <span class="muted">${t("soundsLike")}</span><span><b>${esc(c.heard)}</b> ${d ? `<span class="ipa">/${d.h}/</span>` : ""}</span>
      <button class="play" data-clip>${t("playClip")}</button>
    </div>
    <div class="why">${d ? (d.why.length ? d.why.join(t("sep")) : t("sameSounds"))
      : t("noIpa")}</div>`;
}

function showCompare(el, c, clip) {
  if (!pop) { pop = document.createElement("div"); pop.className = "pop"; document.body.appendChild(pop); }
  pop.innerHTML = `<div class="h"><b>${t("compareTitle")}</b><button class="link" id="popClose">${t("close")}</button></div>${compareHtml(c)}
    <div class="row"><button class="link" id="popRedo">${t("repick")}</button></div>`;

function bindPlay(clip, root = pop) {
  root.querySelectorAll("[data-say]").forEach(b => b.onclick = () => sayWord(b.dataset.say));
  root.querySelectorAll("[data-clip]").forEach(b => b.onclick = () => playWord(clip.wid));

// the word's own audio, cut on the server at its (aligned) times: exact, unlike
// seeking the compressed recording and stopping it on a timer
const wordAudio = new Audio();
async function playWord(wid) {
  $("#audio")?.pause();
  wordAudio.src = `/api/words/${wid}/clip.wav?v=${Date.now()}`;  // times can change after alignment
  try { await wordAudio.play(); } catch { toast(t("clipFail")); }
}

const VOICES = { dict: t("voiceDict"), female: t("voiceFemale"), male: t("voiceMale") };
let voice = localGet("voice", "dict");
if (!(voice in VOICES)) voice = "dict";
function voiceSelect() {
  return `<select class="voice" title="${t("voiceTitle")}">${Object.entries(VOICES).map(([k, v]) =>
    `<option value="${k}" ${k === voice ? "selected" : ""}>${v}</option>`).join("")}</select>`;
}
addEventListener("change", e => {
  if (!e.target.matches("select.voice")) return;
  voice = e.target.value; localSet("voice", voice);
  document.querySelectorAll("select.voice").forEach(s => s.value = voice);
});

const sayAudio = new Audio();
async function sayWord(word) {
  word = norm(word);
  if (voice !== "dict") {
    // synthesised: the first time per word takes a moment (and loads the model)
    const timer = setTimeout(() => toast(t("synth")), 400);
    try {
      const res = await fetch(`/api/pronounce?word=${encodeURIComponent(word)}&voice=${voice}`);
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      sayAudio.src = URL.createObjectURL(await res.blob());
      clearTimeout(timer); await sayAudio.play(); return;
    } catch (e) { clearTimeout(timer); toast(t("voiceFail", { voice: VOICES[voice], msg: e.message })); return; }
  }
  sayAudio.src = `/api/pronounce?word=${encodeURIComponent(word)}`;
  try { await sayAudio.play(); return; } catch {}
  // no dictionary recording (or offline): fall back to the system voice
  if (!("speechSynthesis" in window)) { toast(t("noStd")); return; }
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang === "en-US");
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  toast(t("sysVoice"));
}

  lines.innerHTML = live.segs.map(s => `<div class="line">
      <span class="t">${fmt(s.start)}</span><span class="who">${chip(s.speaker)}</span>
      <span class="text">${wordsHtml(s)}</span></div>`).join("");
  $("#livePartial").textContent = live.partial ? live.partial + " …" : "";
  lines.parentElement.classList.toggle("show-low", state.low);
}

const WORKLET = `class Cap extends AudioWorkletProcessor {
  process(inputs) { const c = inputs[0] && inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; }
} registerProcessor("cap", Cap);`;

async function startLive() {
  try {
    live.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: false, noiseSuppression: true } });
  } catch (e) { toast(t("micFail", { msg: e.message })); return; }
  try {
    live.id = (await api("/api/live/start", { method: "POST", body: { threshold: state.threshold } })).id;
  } catch (e) { live.stream.getTracks().forEach(tr => tr.stop()); toast(t("error", { msg: e.message })); return; }
  live.ctx = new AudioContext();
  live.rate = live.ctx.sampleRate;
  await live.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const src = live.ctx.createMediaStreamSource(live.stream);
  live.node = new AudioWorkletNode(live.ctx, "cap");
  live.node.port.onmessage = e => {
    live.buf.push(e.data);
    let sum = 0; for (const v of e.data) sum += v * v;
    const lvl = $("#liveLevel"); if (lvl) lvl.style.width = Math.min(100, Math.sqrt(sum / e.data.length) * 400) + "%";
  };
  src.connect(live.node);
  Object.assign(live, { on: true, segs: [], partial: "", t0: Date.now() });
  $("#liveToggle").textContent = t("stop"); $("#liveToggle").className = "big stop";
  $("#liveStatus").innerHTML = `<span class="dot" style="display:inline-block"></span> ${t("recordingNow")}`;
  $("#liveBtn").disabled = true;
  live.timer = setInterval(() => {
    const c = $("#liveClock"); if (c) c.textContent = fmt((Date.now() - live.t0) / 1000);
    sendLive();
  }, 1000);
  renderLive();
}

function takeSamples() {
  // concatenate captured chunks and resample to 16 kHz (linear interpolation)
  const n = live.buf.reduce((a, b) => a + b.length, 0);
  const all = new Float32Array(n); let o = 0;
  for (const b of live.buf) { all.set(b, o); o += b.length; }
  live.buf = [];
  if (live.rate === 16000) return all;
  const ratio = live.rate / 16000, out = new Float32Array(Math.floor(n / ratio));
  for (let i = 0; i < out.length; i++) {
    const x = i * ratio, j = Math.floor(x), f = x - j;
    out[i] = all[j] * (1 - f) + (all[j + 1] ?? all[j]) * f;
  }
  return out;
}

async function sendLive() {
  if (live.inflight || !live.buf.length || live.id == null) return;
  live.inflight = true;
  try {
    const res = await fetch(`/api/live/${live.id}/audio`, { method: "POST", body: takeSamples(),
      headers: { "Content-Type": "application/octet-stream" } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    live.segs.push(...data.committed); live.partial = data.partial;
    renderLive();
    const p = $("#livePartial"); if (p) p.scrollIntoView({ block: "nearest" });
  } catch (e) { toast(t("transcribeErr", { msg: e.message })); }
  live.inflight = false;
}

async function stopLive() {
  clearInterval(live.timer);
  live.on = false;
  live.node?.disconnect(); live.stream?.getTracks().forEach(t => t.stop()); await live.ctx?.close();
  $("#liveBtn").disabled = false;
  const btn = $("#liveToggle");
  if (btn) { btn.textContent = t("startRec"); btn.className = "big start"; }
  await busy(t("finishing"), async () => {
    while (live.inflight) await new Promise(r => setTimeout(r, 100));
    await sendLive();
    const r = await api(`/api/live/${live.id}/stop`, { method: "POST", body: {} });
    live.id = null;
    if (r.recording) { await loadRecs(); openRec(r.recording); pollJobs(); toast(t("liveSaved")); }
    else { live.segs.push(...r.committed); renderLive(); toast(t("tooShort")); }
  });
}

// ---------- the recorder over Bluetooth ----------
const dev = { timer: null, liveTimer: null, segs: [], partial: "", busy: false };

$("#devBtn").onclick = showDevice;
function stopDeviceView() { clearInterval(dev.timer); clearInterval(dev.liveTimer); dev.timer = dev.liveTimer = null; }
function showDevice() {
  closePop(); stopLiveView(); stopDeviceView();
  state.rec = null;
  document.querySelectorAll(".rec").forEach(el => el.classList.remove("active"));
  $("main").classList.remove("mode-turns");
  $("#main").innerHTML = `<div class="live device">
    <div class="live-head">
      <button class="big" id="devToggle">${t("devConnect")}</button>
      <span class="status" id="devStatus">${t("devHint")}</span>
    </div>
    <div class="dev-cards" id="devCards"></div>
    <div class="row dev-sync" id="devSyncRow" hidden>
      <button class="primary" id="devSync">${t("devSync")}</button>
      <label><input type="checkbox" id="devDelete"> ${t("devDelete")}</label>
    </div>
    <div id="devLiveBox" hidden>
      <h3>${t("devLiveTitle")}</h3>
      <div class="live-head">
        <button class="big start" id="devLive">${t("devLiveStart")}</button>
        <span class="clock" id="devClock">0:00</span>
        <div class="meter"><div id="devLevel"></div></div>
        <label><input type="checkbox" id="devSave"> ${t("devSave")}</label>
        <span class="status">${t("devLiveHint")}</span>
      </div>
      <div class="lines" id="devLines"></div>
      <div class="partial" id="devPartial"></div>
    </div>
  </div>`;
  $("#devDelete").checked = localGet("devDelete", "0") === "1";
  $("#devDelete").onchange = e => localSet("devDelete", e.target.checked ? "1" : "0");
  $("#devToggle").onclick = toggleDevice;
  $("#devSync").onclick = syncDevice;
  $("#devLive").onclick = () => dev.liveTimer ? stopDeviceLive() : startDeviceLive();
  refreshDevice();
  dev.timer = setInterval(refreshDevice, 5000);
}

function renderDevice(d) {
  if (!$("#devCards")) return stopDeviceView();
  $("#devToggle").textContent = d.connected ? t("devDisconnect") : t("devConnect");
  $("#devStatus").textContent = d.connected ? t("devOn") + (d.mtu ? ` · MTU ${d.mtu}` : "") : d.error || t("devHint");
  $("#devSyncRow").hidden = $("#devLiveBox").hidden = !d.connected;
  if (d.live && !dev.liveTimer) {  // still on from before: follow it again
    dev.segs = []; $("#devLive").textContent = t("stop"); $("#devLive").className = "big stop";
    dev.liveTimer = setInterval(pollDeviceLive, 1000);
  }
  const s = d.status || {}, f = d.files;
  const pct = s.pct != null && s.pct !== "-1" ? +s.pct : null;
  const card = (label, value, extra = "") => `<div class="dev-card"><div class="k">${label}</div><div class="v">${value}</div>${extra}</div>`;
  $("#devCards").innerHTML = !d.connected ? "" : [
    card(t("devBattery"), pct == null ? "–" : `${pct}%`,
      pct == null ? "" : `<div class="meter batt ${pct < 15 ? "low" : ""}"><div style="width:${pct}%"></div></div><div class="sub">${esc(s.bat || "")} V</div>`),
    card(t("devState"), esc((t("devStates") || {})[s.state] || s.state || "–"),
      s.level != null ? `<div class="sub">${t("devLevel", { v: esc(s.level), f: esc(s.floor) })}</div>` : ""),
    card(t("devClock"), s.clock === "unset" ? t("devUnset") : esc((s.clock || "–").replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)$/, "$1-$2-$3 $4:$5:$6"))),
    card(t("devFiles"), f ? t("devFilesN", { n: f.count, mb: (f.bytes / 1e6).toFixed(1) }) : "–"),
  ].join("");
}

async function refreshDevice() {
  if (dev.busy) return;
  try { renderDevice(await api("/api/device")); } catch (e) { toast(t("error", { msg: e.message })); }
}

async function toggleDevice() {
  const connected = $("#devToggle").textContent === t("devDisconnect");
  dev.busy = true;
  try {
    if (connected) { if (dev.liveTimer) await stopDeviceLive(); renderDevice(await api("/api/device/disconnect", { method: "POST", body: {} })); }
    else await busy(t("devConnecting"), async () => renderDevice(await api("/api/device/connect", { method: "POST", body: {} })));
  } catch (e) { toast(t("error", { msg: e.message })); }
  dev.busy = false;
  if (!connected) refreshDevice();
}

async function syncDevice() {
  try {
    await api("/api/device/sync", { method: "POST", body: { delete: $("#devDelete").checked, threshold: state.threshold } });
    toast(t("devSyncStarted")); pollJobs();
  } catch (e) { toast(t("error", { msg: e.message })); }
}

function renderDeviceLive() {
  const lines = $("#devLines"); if (!lines) return;
  lines.innerHTML = dev.segs.map(s => `<div class="line">
      <span class="t">${fmt(s.start)}</span><span class="who">${chip(s.speaker)}</span>
      <span class="text">${wordsHtml(s)}</span></div>`).join("");
  $("#devPartial").textContent = dev.partial ? dev.partial + " …" : "";
}

async function startDeviceLive() {
  try { await api("/api/device/live/start", { method: "POST", body: { threshold: state.threshold } }); }
  catch (e) { toast(t("error", { msg: e.message })); return; }
  Object.assign(dev, { segs: [], partial: "" });
  $("#devLive").textContent = t("stop"); $("#devLive").className = "big stop";
  dev.liveTimer = setInterval(pollDeviceLive, 1000);
  renderDeviceLive();
}

async function pollDeviceLive() {
  try {
    const r = await api(`/api/device/live?from=${dev.segs.length}`);
    if (!r.on) return stopDeviceLive();
    dev.segs.push(...r.committed); dev.partial = r.partial;
    const c = $("#devClock"); if (c) c.textContent = fmt(r.duration);
    const lvl = $("#devLevel"); if (lvl) lvl.style.width = Math.min(100, r.level * 400) + "%";
    renderDeviceLive();
  } catch (e) { toast(t("transcribeErr", { msg: e.message })); }
}

async function stopDeviceLive() {
  clearInterval(dev.liveTimer); dev.liveTimer = null;
  const btn = $("#devLive");
  if (btn) { btn.textContent = t("devLiveStart"); btn.className = "big start"; }
  await busy(t("finishing"), async () => {
    const r = await api("/api/device/live/stop", { method: "POST", body: { save: $("#devSave")?.checked } });
    dev.segs.push(...r.committed); dev.partial = ""; renderDeviceLive();
    if (r.recording) { await loadRecs(); pollJobs(); toast(t("liveSaved")); }
  });
}

(async () => {
  try { await Promise.all([loadRecs(), loadSpeakers()]); pollJobs(); }
  catch (e) { toast(t("noServer", { msg: e.message })); return; }
  if (state.recs.length) openRec(state.recs[state.recs.length - 1].id);
})();
</script>
