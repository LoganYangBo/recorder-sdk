<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recorder</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
  --accent: #2f6fdb; --accent-soft: #e6eefc; --hover: #f1f1ed; --warn: #b4690e;
  --danger: #c0392b; --play: #fff6d6;
  --s0: #2f6fdb; --s1: #0f8a6a; --s2: #a347b8; --s3: #c2570c; --s4: #b8336a; --s5: #5b6ac9;
  --other: #8a8a84;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #e9e9e4; --muted: #9a9a93; --line: #33332f;
    --accent: #7aa7ff; --accent-soft: #23314d; --hover: #2a2a27; --warn: #e3a24a;
    --danger: #ef7563; --play: #3a3420;
    --s0: #7aa7ff; --s1: #4cc8a3; --s2: #d08ae0; --s3: #f0955a; --s4: #ef7aa6; --s5: #9aa5f5;
    --other: #8a8a84;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
button, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: none; background: none; color: var(--accent); padding: 0; }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 9px; outline: none; }
input:focus { border-color: var(--accent); }

header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header input[type=search] { flex: 1; min-width: 0; max-width: 420px; }
header button { white-space: nowrap; }
header .spacer { flex: 1; }

.layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 51px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin: 14px 14px 6px; font-weight: 600; }
.rec { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
.rec:hover { background: var(--hover); }
.rec.active { background: var(--accent-soft); border-left-color: var(--accent); }
.rec .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec .meta { color: var(--muted); font-size: 12px; }
main { overflow-y: auto; }
.empty { color: var(--muted); padding: 40px; text-align: center; }

.top { position: sticky; top: 0; background: var(--bg); z-index: 3; padding: 14px 20px 8px;
  border-bottom: 1px solid var(--line); }
.top h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; }
.top audio { width: 100%; height: 36px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 8px;
  color: var(--muted); font-size: 13px; }
.toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.seg-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg-toggle button { border: none; border-radius: 0; padding: 3px 10px; }
.seg-toggle button.on { background: var(--accent); color: #fff; }

.selbar { display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
  background: var(--accent-soft); border-radius: 8px; }
.selbar.show { display: flex; flex-wrap: wrap; }

.lines { padding: 8px 12px 80px; }
.line { display: grid; grid-template-columns: 22px 64px 110px 1fr; gap: 8px; padding: 6px 8px;
  border-radius: 6px; align-items: baseline; }
.line:hover { background: var(--hover); }
.line.playing { background: var(--play); }
.line.flash { outline: 2px solid var(--accent); }
.line .n { color: var(--muted); font-size: 11px; text-align: right; }
.line .t { color: var(--accent); cursor: pointer; font-variant-numeric: tabular-nums; font-size: 13px; }
.line .t:hover { text-decoration: underline; }
.line input[type=checkbox] { margin: 0; }
.mode-turns .line { grid-template-columns: 64px 110px 1fr; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 10px;
  border: 1px solid currentColor; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 108px; }
.chip.none { color: var(--muted); border-style: dashed; font-weight: 400; }
.score { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.text .w { cursor: pointer; border-radius: 3px; }
.text .w:hover { background: var(--accent-soft); }
.show-low .text .w.low { text-decoration: underline dotted var(--warn) 2px; text-underline-offset: 3px; }
.show-low .text .w.vlow { color: var(--warn); }

.results .hit { padding: 10px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
.results .hit:hover { background: var(--hover); }
.results .hit .meta { color: var(--muted); font-size: 12px; }
mark { background: var(--play); color: inherit; padding: 0 1px; }

.drawer { position: fixed; top: 51px; right: 0; bottom: 0; width: 340px; background: var(--panel);
  border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .15s;
  z-index: 10; overflow-y: auto; padding: 16px; box-shadow: -4px 0 16px rgba(0,0,0,.06); }
.drawer.open { transform: none; }
.drawer h3 { margin: 0 0 10px; font-size: 15px; }
.drawer section { margin-bottom: 22px; }
.drawer .spk { display: flex; align-items: center; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--line); }
.drawer .spk .count { color: var(--muted); font-size: 12px; flex: 1; }
.drawer p.hint { color: var(--muted); font-size: 12px; margin: 6px 0; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input { flex: 1; }
.slider b { font-variant-numeric: tabular-nums; width: 36px; }
.row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s;
  pointer-events: none; z-index: 20; max-width: 80vw; }
.toast.show { opacity: .92; }
.busy { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center;
  justify-content: center; z-index: 30; }
.busy.show { display: flex; }
.busy div { background: var(--panel); padding: 16px 22px; border-radius: 10px; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 180px; border-right: none; border-bottom: 1px solid var(--line); }
  .line { grid-template-columns: 22px 58px 1fr; }
  .line .who { grid-column: 3; }
  header .spacer { display: none; }
  .line .text { grid-column: 2 / 4; }
  .mode-turns .line { grid-template-columns: 58px 1fr; }
  .mode-turns .line .who { grid-column: 2; }
  .mode-turns .line .text { grid-column: 1 / 3; }
  .drawer { width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>Recorder</h1>
  <input type="search" id="q" placeholder="搜索全部转写…">
  <span class="spacer"></span>
  <button id="openSpk">说话人</button>
</header>

<div class="layout">
  <aside>
    <h2>录音</h2>
    <div id="recs"></div>
  </aside>
  <main id="main"><div class="empty">在左侧选一条录音</div></main>
</div>

<div class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="margin:0">说话人</h3><button class="link" id="closeSpk">关闭</button>
  </div>
  <section>
    <div id="spkList"></div>
    <p class="hint">录入新的人：在转写里勾选他说的几段（合计 30 秒以上最好），在上方填名字后点“录入”。同名再录会覆盖。</p>
  </section>
  <section>
    <h3>阈值</h3>
    <div class="slider"><input type="range" id="thr" min="0" max="0.8" step="0.01"><b id="thrVal"></b></div>
    <p class="hint">最像的人分数低于阈值就标为 other。调整后点“应用”，只用已存分数，立刻生效。</p>
    <div class="row">
      <button class="primary" id="applyThr">应用到全部录音</button>
      <button id="rescore">重新计算全部</button>
    </div>
    <p class="hint">录入或删除某人后，用“重新计算全部”重新比对音频（较慢）。</p>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div id="busyText">处理中…</div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const state = {
  recs: [], rec: null, segs: [], speakers: [], selected: new Set(),
  mode: localGet("mode", "segments"), scores: localGet("scores", "0") === "1",
  low: localGet("low", "1") === "1", threshold: parseFloat(localGet("threshold", "0.3")),
};

function localGet(k, d) { try { return localStorage.getItem("rec." + k) ?? d; } catch { return d; } }
function localSet(k, v) { try { localStorage.setItem("rec." + k, v); } catch {} }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function busy(text, fn) {
  $("#busyText").textContent = text; $("#busy").classList.add("show");
  try { return await fn(); } catch (e) { toast("出错：" + e.message); } finally { $("#busy").classList.remove("show"); }
}

const fmt = t => {
  t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function speakerColor(name) {
  if (!name || name === "other") return "var(--other)";
  if (name === "me") return "var(--s0)";
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `var(--s${1 + (h % 5)})`;
}
function chip(name) {
  if (!name) return `<span class="chip none">未标注</span>`;
  return `<span class="chip" style="color:${speakerColor(name)}" title="${esc(name)}">${esc(name)}</span>`;
}

// ---------- recordings ----------
async function loadRecs() {
  state.recs = await api("/api/recordings");
  $("#recs").innerHTML = state.recs.length ? state.recs.map(r => `
    <div class="rec ${state.rec?.id === r.id ? "active" : ""}" data-id="${r.id}">
      <div class="name" title="${esc(r.path)}">${esc(r.name)}</div>
      <div class="meta">#${r.id} · ${fmt(r.duration)} · ${r.segments} 段 · ${esc(r.model || "?")}</div>
    </div>`).join("") : `<div class="empty">还没有录音。先运行<br><code>recorder transcribe 文件</code></div>`;
}
$("#recs").addEventListener("click", e => {
  const el = e.target.closest(".rec"); if (el) openRec(+el.dataset.id);
});

async function openRec(id, focusStart) {
  state.rec = state.recs.find(r => r.id === id);
  state.selected.clear();
  state.segs = await api(`/api/recordings/${id}/segments`);
  document.querySelectorAll(".rec").forEach(el => el.classList.toggle("active", +el.dataset.id === id));
  renderRec();
  if (focusStart != null) seek(focusStart, true);
}

function renderRec() {
  const r = state.rec;
  $("#main").innerHTML = `
    <div class="top">
      <h2>${esc(r.name)}</h2>
      <audio id="audio" controls preload="metadata" src="/api/recordings/${r.id}/audio"></audio>
      <div class="toolbar">
        <span class="seg-toggle">
          <button data-mode="segments" class="${state.mode === "segments" ? "on" : ""}">逐段</button>
          <button data-mode="turns" class="${state.mode === "turns" ? "on" : ""}">按轮次</button>
        </span>
        <label><input type="checkbox" id="optScores" ${state.scores ? "checked" : ""}> 显示分数</label>
        <label><input type="checkbox" id="optLow" ${state.low ? "checked" : ""}> 标出没把握的词</label>
        <span id="counts"></span>
      </div>
      <div class="selbar" id="selbar">
        <span id="selInfo"></span>
        <input type="text" id="enrollName" list="spkNames" placeholder="这个人的名字" style="width:140px">
        <datalist id="spkNames">${state.speakers.map(s => `<option value="${esc(s.name)}">`).join("")}</datalist>
        <button class="primary" id="enrollBtn">录入声纹</button>
        <button class="link" id="clearSel">取消选择</button>
      </div>
    </div>
    <div class="lines" id="lines"></div>`;
  $(".seg-toggle").addEventListener("click", e => {
    const m = e.target.dataset.mode; if (!m) return;
    state.mode = m; localSet("mode", m); state.selected.clear(); renderRec();
  });
  $("#optScores").onchange = e => { state.scores = e.target.checked; localSet("scores", state.scores ? "1" : "0"); renderLines(); };
  $("#optLow").onchange = e => { state.low = e.target.checked; localSet("low", state.low ? "1" : "0"); renderLines(); };
  $("#enrollBtn").onclick = enrollSelected;
  $("#clearSel").onclick = () => { state.selected.clear(); renderLines(); };
  $("#audio").addEventListener("timeupdate", highlightPlaying);
  renderLines();
}

function turns(segs, maxGap = 1.5) {
  const out = [];
  for (const s of segs) {
    const last = out[out.length - 1];
    if (last && last.speaker === s.speaker && s.start - last.end <= maxGap) {
      last.end = Math.max(last.end, s.end); last.segs.push(s);
    } else out.push({ start: s.start, end: s.end, speaker: s.speaker, segs: [s] });
  }
  return out;
}

function wordsHtml(seg) {
  if (!seg.words.length) return esc(seg.text);
  return seg.words.map(([w, st, , p]) => {
    const cls = p < 0.3 ? "w low vlow" : p < 0.6 ? "w low" : "w";
    return `<span class="${cls}" data-t="${st}" title="${Math.round(p * 100)}%">${esc(w)}</span>`;
  }).join(" ");
}

function renderLines() {
  const lines = $("#lines");
  lines.parentElement.classList.toggle("show-low", state.low);
  const counts = {};
  state.segs.forEach(s => { counts[s.speaker || "未标注"] = (counts[s.speaker || "未标注"] || 0) + 1; });
  $("#counts").textContent = Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(" · ");
  if (!state.segs.length) { lines.innerHTML = `<div class="empty">这条录音没有转写内容</div>`; return; }
  const isTurns = state.mode === "turns";
  $("main").classList.toggle("mode-turns", isTurns);
  if (isTurns) {
    lines.innerHTML = turns(state.segs).map(t => `
      <div class="line" data-start="${t.start}" data-end="${t.end}">
        <span class="t" data-t="${t.start}">${fmt(t.start)}</span>
        <span class="who">${chip(t.speaker)}</span>
        <span class="text">${t.segs.map(wordsHtml).join(" ")}</span>
      </div>`).join("");
  } else {
    lines.innerHTML = state.segs.map(s => {
      const score = state.scores && s.score != null
        ? `<span class="score">${s.match !== s.speaker ? "~" + esc(s.match) + " " : ""}${s.score.toFixed(2)}</span>` : "";
      return `
      <div class="line" data-start="${s.start}" data-end="${s.end}" data-n="${s.n}">
        <input type="checkbox" data-n="${s.n}" ${state.selected.has(s.n) ? "checked" : ""}>
        <span class="t" data-t="${s.start}">${fmt(s.start)}<span class="n"> #${s.n}</span></span>
        <span class="who">${chip(s.speaker)}${score}</span>
        <span class="text">${wordsHtml(s)}</span>
      </div>`;
    }).join("");
  }
  updateSelbar();
}

$("#main").addEventListener("click", e => {
  const t = e.target.closest("[data-t]");
  if (t && !e.target.matches("input")) seek(parseFloat(t.dataset.t));
});
$("#main").addEventListener("change", e => {
  if (!e.target.matches(".line input[type=checkbox]")) return;
  const n = +e.target.dataset.n;
  e.target.checked ? state.selected.add(n) : state.selected.delete(n);
  updateSelbar();
});

function updateSelbar() {
  const bar = $("#selbar"); if (!bar) return;
  const segs = state.segs.filter(s => state.selected.has(s.n));
  const secs = segs.reduce((a, s) => a + (s.end - s.start), 0);
  bar.classList.toggle("show", segs.length > 0);
  $("#selInfo").textContent = `已选 ${segs.length} 段，共 ${Math.round(secs)} 秒`;
}

function seek(t, play = true) {
  const a = $("#audio"); if (!a) return;
  a.currentTime = t; if (play) a.play().catch(() => {});
}
function highlightPlaying() {
  const t = $("#audio").currentTime;
  let cur = null;
  document.querySelectorAll(".line").forEach(el => {
    const on = t >= +el.dataset.start && t < +el.dataset.end;
    el.classList.toggle("playing", on); if (on) cur = el;
  });
  if (cur && cur !== highlightPlaying.last) {
    const r = cur.getBoundingClientRect();
    if (r.top < 160 || r.bottom > innerHeight) cur.scrollIntoView({ block: "center", behavior: "smooth" });
    highlightPlaying.last = cur;
  }
}

async function enrollSelected() {
  const name = $("#enrollName").value.trim();
  if (!name) { toast("先填名字"); return; }
  const exists = state.speakers.some(s => s.name === name);
  if (exists && !confirm(`已有“${name}”的声纹，用选中的段覆盖它？`)) return;
  await busy(`正在录入 ${name} 的声纹…（第一次会加载模型）`, async () => {
    await api("/api/speakers/enroll", { method: "POST",
      body: { name, recording: state.rec.id, segments: [...state.selected] } });
    state.selected.clear();
    await loadSpeakers();
    toast(`已录入 ${name}。点“说话人 → 重新计算全部”给所有录音重新打标签`);
    renderRec();
  });
}

// ---------- speakers ----------
async function loadSpeakers() {
  state.speakers = await api("/api/speakers");
  $("#spkList").innerHTML = state.speakers.length ? state.speakers.map(s => `
    <div class="spk">${chip(s.name)}<span class="count">${s.segments} 段</span>
      <button class="link danger" data-forget="${esc(s.name)}">删除</button></div>`).join("")
    : `<p class="hint">还没有声纹。先运行 <code>recorder enroll my_voice.m4a</code> 录入你自己（me）。</p>`;
}
$("#spkList").addEventListener("click", async e => {
  const name = e.target.dataset.forget; if (!name) return;
  if (!confirm(`删除“${name}”的声纹？已打的标签要“重新计算全部”后才会更新。`)) return;
  await busy("删除中…", async () => {
    await api(`/api/speakers/${encodeURIComponent(name)}`, { method: "DELETE" });
    await loadSpeakers(); toast(`已删除 ${name}`);
  });
});
$("#openSpk").onclick = () => $("#drawer").classList.toggle("open");
$("#closeSpk").onclick = () => $("#drawer").classList.remove("open");

const thr = $("#thr");
thr.value = state.threshold; $("#thrVal").textContent = state.threshold.toFixed(2);
thr.oninput = () => { $("#thrVal").textContent = (+thr.value).toFixed(2); };
async function relabel(rescore) {
  state.threshold = +thr.value; localSet("threshold", thr.value);
  await busy(rescore ? "正在重新比对全部录音的音频…" : "应用阈值…", async () => {
    const r = await api("/api/relabel", { method: "POST", body: { threshold: state.threshold, rescore } });
    await loadSpeakers(); await loadRecs();
    if (state.rec) await openRec(state.rec.id);
    toast(`已更新 ${r.recordings} 条录音`);
  });
}
$("#applyThr").onclick = () => relabel(false);
$("#rescore").onclick = () => relabel(true);

// ---------- search ----------
let searchTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(() => q ? search(q) : (state.rec ? renderRec() : ($("#main").innerHTML = `<div class="empty">在左侧选一条录音</div>`)), 250);
});
async function search(q) {
  const hits = await api("/api/search?q=" + encodeURIComponent(q));
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  $("#main").innerHTML = `<div class="results">
    <div class="top"><h2>“${esc(q)}” 共 ${hits.length} 条${hits.length === 100 ? "（只显示前 100）" : ""}</h2></div>
    ${hits.map(h => `<div class="hit" data-rec="${h.recording}" data-start="${h.start}">
      <div>${chip(h.speaker)} ${esc(h.text).replace(re, m => `<mark>${m}</mark>`)}</div>
      <div class="meta">${esc(h.name)} · ${fmt(h.start)}</div></div>`).join("")}
  </div>`;
}
$("#main").addEventListener("click", e => {
  const h = e.target.closest(".hit"); if (!h) return;
  $("#q").value = "";
  openRec(+h.dataset.rec, +h.dataset.start);
});

(async () => {
  try { await Promise.all([loadRecs(), loadSpeakers()]); }
  catch (e) { toast("连不上本地服务：" + e.message); return; }
  if (state.recs.length) openRec(state.recs[state.recs.length - 1].id);
})();
</script>
</body>
</html>
